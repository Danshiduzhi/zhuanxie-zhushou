<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="转写助手">
<meta name="theme-color" content="#f5f5f7">
<title>转写助手</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.4-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10M8 11l4 4 4-4"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-9.3A4 4 0 0 1 12 8a4 4 0 0 1 7 2.7C19 15.4 12 20 12 20Z"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8Z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8Z"/></symbol>
</svg>

<header class="bar">
  <div class="brand">
    <div class="logo"><svg><use href="#i-mic"/></svg></div>
    <span>转写助手</span>
  </div>
  <div class="bar-actions">
    <button class="round" id="themeBtn" aria-label="主题"><svg><use href="#i-sun"/></svg></button>
    <button class="round" id="settingBtn" aria-label="设置"><svg><use href="#i-gear"/></svg></button>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <button class="rec-btn" id="recBtn" aria-label="开始录音">
      <svg class="rec-icon"><use href="#i-mic"/></svg>
      <span class="rec-ring"></span>
    </button>
    <div class="rec-time" id="recTime">00:00</div>
    <div class="rec-hint" id="recHint">点击开始录音</div>

    <div class="alt-actions">
      <button class="pill" id="fileBtn"><svg><use href="#i-file"/></svg><span>选择音视频</span></button>
      <button class="pill" id="donateBtn"><svg><use href="#i-heart"/></svg><span>打赏</span></button>
    </div>
    <input type="file" id="fileInput" hidden accept="audio/*,video/*">
  </section>

  <section class="panel hidden" id="workPanel">
    <div class="panel-head">
      <span id="workName">处理中…</span>
      <span class="muted" id="workPct"></span>
    </div>
    <div class="bar"><div class="bar-fill" id="workBar" style="width:0%"></div></div>
    <div class="work-actions">
      <button class="link" id="cancelBtn">取消</button>
    </div>
  </section>

  <section class="result hidden" id="resultPanel">
    <div class="result-head">
      <div>
        <div class="result-title" id="resultTitle">转写结果</div>
        <div class="muted" id="resultMeta"></div>
      </div>
      <button class="round small" id="closeResult" aria-label="关闭"><svg><use href="#i-x"/></svg></button>
    </div>
    <textarea id="resultText" class="result-text" spellcheck="false"></textarea>
    <div class="result-actions">
      <button class="pill" id="copyBtn"><svg><use href="#i-copy"/></svg><span>复制</span></button>
      <button class="pill" id="saveBtn"><svg><use href="#i-download"/></svg><span>保存</span></button>
      <button class="pill" id="shareBtn" hidden><svg><use href="#i-share"/></svg><span>分享</span></button>
      <button class="pill accent" id="aiBtn"><svg><use href="#i-spark"/></svg><span>AI 整理</span></button>
    </div>
  </section>
</main>

<!-- 设置抽屉 -->
<div class="sheet-mask hidden" id="sheetMask"></div>
<div class="sheet hidden" id="sheet">
  <div class="sheet-head">
    <span>设置</span>
    <button class="round small" id="sheetClose"><svg><use href="#i-x"/></svg></button>
  </div>
  <div class="sheet-body">
    <div class="group">
      <div class="group-title">语音识别</div>
      <label class="field">
        <span>服务商</span>
        <select id="asrProvider">
          <option value="siliconflow">硅基流动 SiliconFlow</option>
          <option value="openai">OpenAI</option>
          <option value="custom">自定义（OpenAI 兼容）</option>
        </select>
      </label>
      <label class="field">
        <span>接口地址</span>
        <input id="asrBase" placeholder="https://api.siliconflow.cn/v1" autocomplete="off">
      </label>
      <label class="field">
        <span>API Key</span>
        <input id="asrKey" type="password" placeholder="sk-…" autocomplete="off">
      </label>
      <label class="field">
        <span>模型</span>
        <input id="asrModel" placeholder="FunAudioLLM/SenseVoiceSmall" autocomplete="off">
      </label>
      <label class="field">
        <span>语言</span>
        <select id="asrLang">
          <option value="zh">中文</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
          <option value="auto">自动</option>
        </select>
      </label>
    </div>

    <div class="group">
      <div class="group-title">AI 整理（可选）</div>
      <label class="field">
        <span>地址</span>
        <input id="llmBase" placeholder="https://api.deepseek.com/v1" autocomplete="off">
      </label>
      <label class="field">
        <span>Key</span>
        <input id="llmKey" type="password" placeholder="sk-…" autocomplete="off">
      </label>
      <label class="field">
        <span>模型</span>
        <input id="llmModel" placeholder="deepseek-chat" autocomplete="off">
      </label>
      <div class="switch-row">
        <div>
          <div>智能校对</div>
          <div class="muted small">修正错别字、补标点</div>
        </div>
        <label class="switch"><input type="checkbox" id="optProof"><span></span></label>
      </div>
      <div class="switch-row">
        <div>
          <div>生成总结</div>
          <div class="muted small">摘要、要点、行动项</div>
        </div>
        <label class="switch"><input type="checkbox" id="optSummary"><span></span></label>
      </div>
    </div>

    <button class="save-btn" id="saveSetting">保存设置</button>
    <p class="foot">所有 Key 只保存在本机浏览器，不会上传到任何服务器。<br>录音与识别直接调用你选择的 API 服务。</p>
  </div>
</div>

<!-- 打赏 -->
<div class="modal hidden" id="donateModal">
  <div class="modal-box">
    <div class="modal-head">
      <span>支持一下</span>
      <button class="round small" id="donateClose"><svg><use href="#i-x"/></svg></button>
    </div>
    <p class="donate-sub">如果它帮你省下了时间，一杯咖啡就是支持。</p>
    <div class="qr-wrap"><img src="donate.png" alt="赞赏码"></div>
    <p class="donate-foot">感谢你的支持 ♥</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
